# Изолированная проверка сборки ядра VLESS (singbox-mobile) через gomobile.
# НЕ трогает основные сборки приложения (build.yml). Цель — убедиться, что Go-обёртка
# над sing-box компилируется и биндится gomobile, прежде чем подключать её в gradle/CI.
name: singbox-core

on:
  push:
    branches: [ main ]
    paths: [ "singbox-mobile/**", ".github/workflows/singbox-core.yml" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  bind-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@5c0595f4cdbb
          go install golang.org/x/mobile/cmd/gobind@latest
      - name: go get deps + tidy (olcrtc@master + x/mobile via tools.go)
        working-directory: singbox-mobile
        run: |
          go get github.com/openlibrecommunity/olcrtc@master
          go get golang.org/x/mobile/bind@5c0595f4cdbb
          go mod tidy
      - name: gomobile init
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init
      - name: gomobile bind COMBINED (olcRTC + sing-box → one AAR, one libgojni.so)
        working-directory: singbox-mobile
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile bind -target=android -androidapi 21 \
            -tags with_utls,with_gvisor \
            -ldflags "-s -w -checklinkname=0" \
            -o reedmobile.aar \
            github.com/openlibrecommunity/olcrtc/mobile .
      - uses: actions/upload-artifact@v4
        with:
          name: reedmobile-aar
          path: singbox-mobile/reedmobile.aar

  bind-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "^26.0" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@5c0595f4cdbb
          go install golang.org/x/mobile/cmd/gobind@latest
      - name: go get deps + tidy (olcrtc@master + x/mobile via tools.go)
        working-directory: singbox-mobile
        run: |
          go get github.com/openlibrecommunity/olcrtc@master
          go get golang.org/x/mobile/bind@5c0595f4cdbb
          go mod tidy
      - name: gomobile init
        run: gomobile init
      - name: gomobile bind COMBINED (olcRTC + sing-box → one XCFramework)
        working-directory: singbox-mobile
        run: |
          gomobile bind -target=ios \
            -tags with_utls,with_gvisor \
            -ldflags "-s -w -checklinkname=0" \
            -o ReedMobile.xcframework \
            github.com/openlibrecommunity/olcrtc/mobile .
      - uses: actions/upload-artifact@v4
        with:
          name: reedmobile-xcframework
          path: singbox-mobile/ReedMobile.xcframework
