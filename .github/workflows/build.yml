# Облачная сборка артефактов Reed VPN (APK / EXE / IPA).
# Работает, когда появится проект в app/ (KMP/Compose, Gradle).
# Артефакты скачиваются со вкладки Actions → Run → Artifacts.
name: build

on:
  push:
    branches: [ main ]
    paths: [ "app/**", ".github/workflows/build.yml" ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build APK (debug, unsigned)
        working-directory: app
        run: ./gradlew :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reed-android-apk
          path: app/androidApp/build/outputs/apk/**/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build Windows distributable
        working-directory: app
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reed-windows-exe
          path: app/desktopApp/build/compose/binaries/**/*

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Сборка iOS-фреймворка из KMP + архив Xcode → IPA.
      # Без подписи (для sideload через AltStore/Sideloadly на свой айфон).
      # Для App Store/TestFlight — добавить сертификат/профиль Apple Developer.
      - name: Build unsigned IPA
        working-directory: app
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -archivePath build/Reed.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p build/Payload
          cp -r build/Reed.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -r Reed-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: reed-ios-ipa
          path: app/build/Reed-unsigned.ipa
