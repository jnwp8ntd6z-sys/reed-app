# Reed VPN — облачная сборка артефактов (Android APK / iOS IPA / Windows).
# Основано на рабочем рецепте olcbox (release.yml): JDK21 + Go/gomobile + NDK + olcrtc.
# БЕЗ подписи: debug APK, unsigned IPA (sideload), Windows portable zip.
# Форк приложения лежит в app/. Артефакты — вкладка Actions → Run → Artifacts.
name: build

on:
  push:
    branches: [ main ]
    paths: [ "app/**", "singbox-mobile/**", ".github/workflows/build.yml" ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build (all/android/windows/ios)"
        default: "all"
        type: choice
        options: [ all, android, windows, ios, ios-preview ]

permissions:
  contents: read

env:
  OLCBOX_VERSION: "1.0.1"
  OLCBOX_VERSION_CODE: "6"
  # Пин на июльский коммит форка reedvpnbot/olcrtc (последняя зелёная эпоха 16.07): в нём пакет
  # mobile ещё экспортирует SetProtector/Check/Ping/IsRunning/... — их зовёт Kotlin приложения.
  # НЕ "master": upstream/форк master может уехать (05.09 API пропал → пустой класс Mobile).
  # 24.09: e3db1d2 + ветка reed-no-rtp-ka (703d653): VP8-keepalive (upstream 2614169) по умолчанию выкл —
  # ломал ICE на публичных JVB (olcRTC «не подключается»); первое рукопожатие клиента 30 с.
  OLCRTC_REF: "703d653568206e1773153e50bdaf572b585d381a"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'android' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: reedvpnbot/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3", cache-dependency-path: olcrtc/go.sum }
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@6129f5bee9d5
          go install github.com/magefile/mage@latest
      - name: gomobile init
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init
      - name: Build direct debug APK (для прямой раздачи/тестов)
        working-directory: app
        run: |
          export OLCRTC_REPO="${GITHUB_WORKSPACE}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" :androidApp:assembleDirectDebug --stacktrace
      - name: Build Play release AAB (подписанный, minify+shrink — для Google Play)
        working-directory: app
        run: |
          export OLCRTC_REPO="${GITHUB_WORKSPACE}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" :androidApp:bundlePlayRelease --stacktrace
      - name: Show Play AAB path
        if: always()
        run: |
          aab=$(find app/androidApp/build/outputs/bundle -name '*.aab' | head -1)
          if [ -n "$aab" ]; then echo "AAB: $aab ($(du -h "$aab" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"; else echo "no AAB produced"; fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-play-aab
          path: app/androidApp/build/outputs/bundle/**/*.aab
      # Тот же обход квоты, что и для APK: подписанный AAB (нужен для загрузки в Google
      # Play) зеркалим на файл-хостинг, иначе при исчерпании квоты артефактов он теряется.
      - name: Mirror Play AAB to file host
        if: always()
        run: |
          aab=$(find app/androidApp/build/outputs/bundle -name '*.aab' | head -1)
          if [ -z "$aab" ]; then echo "no AAB produced"; exit 0; fi
          echo "AAB: $aab ($(du -h "$aab" | cut -f1))"
          emit() { echo "AAB_MIRROR_URL=$1"; echo "AAB mirror: $1" >> "$GITHUB_STEP_SUMMARY"; }
          # litterbox (catbox temp, до 1GB, хранит 72ч) — держит крупный AAB (~106MB) и
          # отдаёт прямую ссылку. tmpfiles(100MB)/bashupload на этом размере не сработали.
          u=$(curl -sS --max-time 300 -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@${aab}" "https://litterbox.catbox.moe/resources/internals/api.php" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          # temp.sh
          u=$(curl -sS --max-time 300 --upload-file "${aab}" "https://temp.sh/reed.aab" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          # gofile.io (отдаёт страницу скачивания, не прямую ссылку — крайний случай)
          srv=$(curl -sS --max-time 30 "https://api.gofile.io/servers" 2>/dev/null | sed -n 's/.*"name":"\([a-z0-9]*\)".*/\1/p' | head -1)
          if [ -n "$srv" ]; then
            u=$(curl -sS --max-time 300 -F "file=@${aab}" "https://$srv.gofile.io/uploadFile" 2>/dev/null | sed -n 's/.*"downloadPage":"\([^"]*\)".*/\1/p')
            if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          fi
          echo "all AAB mirrors failed"
      # Fallback delivery: GitHub artifact storage quota is account-wide and is
      # recalculated only every 6-12h, so upload-artifact can hard-fail even
      # after old artifacts are deleted. Mirror the APK to a throwaway file host
      # so the build output is always retrievable from the run log.
      - name: Mirror APK to file host
        if: always()
        run: |
          apk=$(find app/androidApp/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "no APK produced"; exit 0; fi
          # (direct debug APK — прямая раздача; Play-канал = AAB, см. отдельный шаг)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          emit() { echo "APK_MIRROR_URL=$1"; echo "APK mirror: $1" >> "$GITHUB_STEP_SUMMARY"; }
          # tmpfiles.org (JSON {data:{url}})
          j=$(curl -sS --max-time 180 -F "file=@${apk}" https://tmpfiles.org/api/v1/upload 2>/dev/null || true)
          u=$(printf '%s' "$j" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' | sed 's#\\/#/#g')
          if [ -n "$u" ]; then emit "${u/tmpfiles.org\//tmpfiles.org/dl/}"; exit 0; fi
          # bashupload.com (returns wget line)
          u=$(curl -sS --max-time 180 --upload-file "${apk}" "https://bashupload.com/reed.apk" 2>/dev/null | grep -oE 'https://bashupload.com/[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}?download=1"; exit 0; fi
          # temp.sh
          u=$(curl -sS --max-time 180 --upload-file "${apk}" "https://temp.sh/reed.apk" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          # file.io
          u=$(curl -sS --max-time 180 -F "file=@${apk}" https://file.io 2>/dev/null | sed -n 's/.*"link":"\([^"]*\)".*/\1/p')
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          echo "all mirrors failed"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-android-apk
          path: app/androidApp/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'ios') }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: reedvpnbot/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "^26.0" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3", cache-dependency-path: olcrtc/go.sum }
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@6129f5bee9d5
      - name: gomobile init
        working-directory: olcrtc
        run: gomobile init
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project (app + PacketTunnel extension)
        working-directory: app/iosApp
        run: xcodegen generate
      - name: Build signed IPA + upload to TestFlight
        working-directory: app
        env:
          OLCRTC_REPO: ${{ github.workspace }}/olcrtc
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          fastlane ios beta
      # Fallback delivery (как у Android): artifact-квота аккаунта пересчитывается раз в
      # 6-12ч, поэтому upload-artifact может падать. Заливаем .ipa на файл-хостинг, чтобы
      # ссылка всегда была в логе/summary прогона.
      - name: Mirror IPA to file host
        if: always()
        run: |
          ipa=$(find app/dist -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then echo "no IPA produced"; exit 0; fi
          echo "IPA: $ipa ($(du -h "$ipa" | cut -f1))"
          emit() { echo "IPA_MIRROR_URL=$1"; echo "IPA mirror: $1" >> "$GITHUB_STEP_SUMMARY"; }
          j=$(curl -sS --max-time 180 -F "file=@${ipa}" https://tmpfiles.org/api/v1/upload 2>/dev/null || true)
          u=$(printf '%s' "$j" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' | sed 's#\\/#/#g')
          if [ -n "$u" ]; then emit "${u/tmpfiles.org\//tmpfiles.org/dl/}"; exit 0; fi
          u=$(curl -sS --max-time 180 --upload-file "${ipa}" "https://bashupload.com/reed.ipa" 2>/dev/null | grep -oE 'https://bashupload.com/[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}?download=1"; exit 0; fi
          u=$(curl -sS --max-time 180 --upload-file "${ipa}" "https://temp.sh/reed.ipa" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          u=$(curl -sS --max-time 180 -F "file=@${ipa}" https://file.io 2>/dev/null | sed -n 's/.*"link":"\([^"]*\)".*/\1/p')
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          echo "all mirrors failed"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-ios-unsigned-ipa
          path: app/dist/Reed-*-ios-unsigned.ipa

  # Reed 2.0: проверка iOS БЕЗ TestFlight — превью-приложение (те же SwiftUI-файлы, туннель-заглушка) в
  # симуляторе: скриншоты сцен + видео анимаций → ветка ci-results-preview. Подпись/секреты не нужны.
  ios-preview:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms == 'ios-preview' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "^26.0" }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build preview (simulator)
        working-directory: app/iosApp/preview
        run: |
          xcodegen generate
          xcodebuild -project Preview.xcodeproj -scheme Preview -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -150; exit 1; }
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -80 || true
      - name: Shots iOS 26
        working-directory: app/iosApp/preview
        run: ./shots.sh 26 out/ios26
      - name: Shots iOS 18 (ветка без Liquid Glass)
        continue-on-error: true
        working-directory: app/iosApp/preview
        run: SCENES="login home_on family profile" ANIMS="anim_tabs anim_connect" ./shots.sh 18 out/ios18
      - name: Publish results branch
        if: always()
        working-directory: app/iosApp/preview
        run: |
          mkdir -p out; cp build.log out/ 2>/dev/null || true
          xcrun simctl list runtimes > out/runtimes.txt 2>&1 || true
          cd out
          git init -q -b ci-results-preview
          git config user.email ci@example.com; git config user.name ci
          git add -A && git commit -qm "preview ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results-preview

  # Полная сборка приложения + PacketTunnel для симулятора (без подписи и загрузки) — проверка компиляции.
  ios-check:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms == 'ios-preview' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: reedvpnbot/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "^26.0" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3", cache-dependency-path: olcrtc/go.sum }
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@6129f5bee9d5
      - name: gomobile init
        working-directory: olcrtc
        run: gomobile init
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app + extension (simulator, unsigned)
        working-directory: app/iosApp
        env:
          OLCRTC_REPO: ${{ github.workspace }}/olcrtc
        run: |
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            build > build.log 2>&1 || { grep -E "error:|FAILED" build.log | sort -u | head -150; exit 1; }
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -80 || true
      - name: Publish results branch
        if: always()
        working-directory: app/iosApp
        run: |
          mkdir -p ci-out; cp build.log ci-out/ 2>/dev/null || true
          grep -E "error:|warning:" build.log | sort -u > ci-out/diagnostics.txt 2>/dev/null || true
          cd ci-out
          git init -q -b ci-results-check
          git config user.email ci@example.com; git config user.name ci
          git add -A && git commit -qm "check ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results-check

  windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    # Нужен для публикации установщика релизом этого же приватного репозитория.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: reedvpnbot/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.3", cache-dependency-path: olcrtc/go.sum }
      - name: Ensure WiX Toolset (jpackage EXE installer needs candle/light from WiX 3)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Host "WiX already present: $((Get-Command candle.exe).Source)"
          }
      - name: Build Windows portable + EXE installer (unsigned)
        shell: pwsh
        working-directory: app
        run: |
          $env:OLCRTC_REPO="${{ github.workspace }}\olcrtc"
          .\gradlew.bat "-Polcbox.version=$env:OLCBOX_VERSION" "-Polcbox.versionCode=$env:OLCBOX_VERSION_CODE" :desktopApp:packageReleasePortableZip :desktopApp:packageReleaseExe --stacktrace
      - name: Self-sign Windows binaries (Authenticode)
        shell: pwsh
        working-directory: app
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_B64 }}
          PFX_PW: ${{ secrets.WIN_CODESIGN_PFX_PW }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "no codesign secret — skipping signing"; exit 0 }
          $pfx = "$env:RUNNER_TEMP\reed-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $st = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Write-Host "signtool: $st"
          function Sign($f) {
            & $st sign /fd SHA256 /f $pfx /p $env:PFX_PW /tr http://timestamp.digicert.com /td SHA256 "$f"
            if ($LASTEXITCODE -ne 0) { throw "sign failed: $f" }
          }
          # 1) installer .exe
          Get-ChildItem desktopApp/build/compose/binaries/main-release/exe -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { Sign $_.FullName }
          # 2) portable: распаковать → подписать вложенный .exe → перепаковать
          $zip = Get-ChildItem desktopApp/build/compose/binaries/main-release/portable/*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            $tmp = "$env:RUNNER_TEMP\portable"; Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $zip.FullName -DestinationPath $tmp
            Get-ChildItem $tmp -Recurse -Filter *.exe | ForEach-Object { Sign $_.FullName }
            Remove-Item $zip.FullName -Force
            Compress-Archive -Path "$tmp\*" -DestinationPath $zip.FullName
          }
      # Квота на артефакты у аккаунта пересчитывается раз в 6-12 часов, поэтому
      # upload-artifact падает с «Artifact storage quota has been hit». Установщик
      # кладём релизом ЭТОГО ЖЕ приватного репозитория: хранилище релизов отдельное,
      # ссылка стабильная, наружу ничего не уходит.
      - name: Publish installer as private release asset
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(find app/desktopApp/build/compose/binaries/main-release/exe -name '*.exe' | head -1)
          if [ -z "$exe" ]; then echo "no installer produced"; exit 0; fi
          tag="win-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" "$exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Windows $tag" \
            --notes "Сборка Windows из ветки $GITHUB_REF_NAME, коммит $GITHUB_SHA."
          echo "release: $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-windows-portable
          path: app/desktopApp/build/compose/binaries/main-release/portable/*.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-windows-installer
          path: app/desktopApp/build/compose/binaries/main-release/exe/*.exe
