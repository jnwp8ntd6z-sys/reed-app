# Reed VPN — облачная сборка артефактов (Android APK / iOS IPA / Windows).
# Основано на рабочем рецепте olcbox (release.yml): JDK21 + Go/gomobile + NDK + olcrtc.
# БЕЗ подписи: debug APK, unsigned IPA (sideload), Windows portable zip.
# Форк приложения лежит в app/. Артефакты — вкладка Actions → Run → Artifacts.
name: build

on:
  push:
    branches: [ main ]
    paths: [ "app/**", "singbox-mobile/**", ".github/workflows/build.yml" ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build (all/android/windows/ios)"
        default: "all"
        type: choice
        options: [ all, android, windows, ios ]

permissions:
  contents: read

env:
  OLCBOX_VERSION: "1.0.0"
  OLCBOX_VERSION_CODE: "1"
  OLCRTC_REF: "master"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'android' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: lltvutll-max/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: olcrtc/go.sum }
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest
      - name: gomobile init
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init
      - name: Build debug APK (unsigned)
        working-directory: app
        run: |
          export OLCRTC_REPO="${GITHUB_WORKSPACE}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew -Polcbox.version="${OLCBOX_VERSION}" -Polcbox.versionCode="${OLCBOX_VERSION_CODE}" :androidApp:assembleDebug --stacktrace
      # Fallback delivery: GitHub artifact storage quota is account-wide and is
      # recalculated only every 6-12h, so upload-artifact can hard-fail even
      # after old artifacts are deleted. Mirror the APK to a throwaway file host
      # so the build output is always retrievable from the run log.
      - name: Mirror APK to file host
        if: always()
        run: |
          apk=$(find app/androidApp/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "no APK produced"; exit 0; fi
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          emit() { echo "APK_MIRROR_URL=$1"; echo "APK mirror: $1" >> "$GITHUB_STEP_SUMMARY"; }
          # tmpfiles.org (JSON {data:{url}})
          j=$(curl -sS --max-time 180 -F "file=@${apk}" https://tmpfiles.org/api/v1/upload 2>/dev/null || true)
          u=$(printf '%s' "$j" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' | sed 's#\\/#/#g')
          if [ -n "$u" ]; then emit "${u/tmpfiles.org\//tmpfiles.org/dl/}"; exit 0; fi
          # bashupload.com (returns wget line)
          u=$(curl -sS --max-time 180 --upload-file "${apk}" "https://bashupload.com/reed.apk" 2>/dev/null | grep -oE 'https://bashupload.com/[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}?download=1"; exit 0; fi
          # temp.sh
          u=$(curl -sS --max-time 180 --upload-file "${apk}" "https://temp.sh/reed.apk" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          # file.io
          u=$(curl -sS --max-time 180 -F "file=@${apk}" https://file.io 2>/dev/null | sed -n 's/.*"link":"\([^"]*\)".*/\1/p')
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          echo "all mirrors failed"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-android-apk
          path: app/androidApp/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'ios') }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: lltvutll-max/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "^26.0" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: olcrtc/go.sum }
      - name: Install gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
      - name: gomobile init
        working-directory: olcrtc
        run: gomobile init
      - name: Build unsigned iOS app
        working-directory: app
        run: |
          export OLCRTC_REPO="${GITHUB_WORKSPACE}/olcrtc"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphoneos \
            -configuration Release -derivedDataPath build/ios-ipa/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: app
        run: |
          app_path="build/ios-ipa/DerivedData/Build/Products/Release-iphoneos/iosApp.app"
          [ -d "$app_path" ] || { echo "iOS .app not found at $app_path"; exit 1; }
          rm -rf build/ios-ipa/package dist && mkdir -p build/ios-ipa/package/Payload dist
          cp -R "$app_path" build/ios-ipa/package/Payload/
          (cd build/ios-ipa/package && /usr/bin/zip -qry "${GITHUB_WORKSPACE}/app/dist/Reed-${OLCBOX_VERSION}-ios-unsigned.ipa" Payload)
      # Fallback delivery (как у Android): artifact-квота аккаунта пересчитывается раз в
      # 6-12ч, поэтому upload-artifact может падать. Заливаем .ipa на файл-хостинг, чтобы
      # ссылка всегда была в логе/summary прогона.
      - name: Mirror IPA to file host
        if: always()
        run: |
          ipa=$(find app/dist -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then echo "no IPA produced"; exit 0; fi
          echo "IPA: $ipa ($(du -h "$ipa" | cut -f1))"
          emit() { echo "IPA_MIRROR_URL=$1"; echo "IPA mirror: $1" >> "$GITHUB_STEP_SUMMARY"; }
          j=$(curl -sS --max-time 180 -F "file=@${ipa}" https://tmpfiles.org/api/v1/upload 2>/dev/null || true)
          u=$(printf '%s' "$j" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' | sed 's#\\/#/#g')
          if [ -n "$u" ]; then emit "${u/tmpfiles.org\//tmpfiles.org/dl/}"; exit 0; fi
          u=$(curl -sS --max-time 180 --upload-file "${ipa}" "https://bashupload.com/reed.ipa" 2>/dev/null | grep -oE 'https://bashupload.com/[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}?download=1"; exit 0; fi
          u=$(curl -sS --max-time 180 --upload-file "${ipa}" "https://temp.sh/reed.ipa" 2>/dev/null | grep -oE 'https?://[^ ]+' | head -1 || true)
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          u=$(curl -sS --max-time 180 -F "file=@${ipa}" https://file.io 2>/dev/null | sed -n 's/.*"link":"\([^"]*\)".*/\1/p')
          if [ -n "$u" ]; then emit "${u}"; exit 0; fi
          echo "all mirrors failed"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reed-ios-unsigned-ipa
          path: app/dist/Reed-*-ios-unsigned.ipa

  windows:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: lltvutll-max/olcrtc
          ref: ${{ env.OLCRTC_REF }}
          path: olcrtc
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache-dependency-path: olcrtc/go.sum }
      - name: Ensure WiX Toolset (jpackage EXE installer needs candle/light from WiX 3)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            Write-Host "WiX already present: $((Get-Command candle.exe).Source)"
          }
      - name: Build Windows portable + EXE installer (unsigned)
        shell: pwsh
        working-directory: app
        run: |
          $env:OLCRTC_REPO="${{ github.workspace }}\olcrtc"
          .\gradlew.bat "-Polcbox.version=$env:OLCBOX_VERSION" "-Polcbox.versionCode=$env:OLCBOX_VERSION_CODE" :desktopApp:packageReleasePortableZip :desktopApp:packageReleaseExe --stacktrace
      - name: Self-sign Windows binaries (Authenticode)
        shell: pwsh
        working-directory: app
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_B64 }}
          PFX_PW: ${{ secrets.WIN_CODESIGN_PFX_PW }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "no codesign secret — skipping signing"; exit 0 }
          $pfx = "$env:RUNNER_TEMP\reed-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $st = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Write-Host "signtool: $st"
          function Sign($f) {
            & $st sign /fd SHA256 /f $pfx /p $env:PFX_PW /tr http://timestamp.digicert.com /td SHA256 "$f"
            if ($LASTEXITCODE -ne 0) { throw "sign failed: $f" }
          }
          # 1) installer .exe
          Get-ChildItem desktopApp/build/compose/binaries/main-release/exe -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { Sign $_.FullName }
          # 2) portable: распаковать → подписать вложенный .exe → перепаковать
          $zip = Get-ChildItem desktopApp/build/compose/binaries/main-release/portable/*.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) {
            $tmp = "$env:RUNNER_TEMP\portable"; Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $zip.FullName -DestinationPath $tmp
            Get-ChildItem $tmp -Recurse -Filter *.exe | ForEach-Object { Sign $_.FullName }
            Remove-Item $zip.FullName -Force
            Compress-Archive -Path "$tmp\*" -DestinationPath $zip.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: reed-windows-portable
          path: app/desktopApp/build/compose/binaries/main-release/portable/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reed-windows-installer
          path: app/desktopApp/build/compose/binaries/main-release/exe/*.exe
