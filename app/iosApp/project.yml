# XcodeGen-спека iOS-проекта Reed. Генерит Reed.xcodeproj (приложение + PacketTunnel extension)
# на CI (macOS), чтобы собирать без ручного Xcode. Заменяет старый ручной pbxproj.
# Настройки перенесены 1:1 из прежнего project.pbxproj + добавлен таргет расширения-туннеля.
name: Reed
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JA8VKNQGTB
    SUPPORTS_MACCATALYST: false
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # Ручная подпись App Store distribution (сертификат+профили — fastlane match
    # по ASC API-ключу — device-free, без Development-профиля который требует устройств).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"

targets:
  Reed:
    type: application
    platform: iOS
    sources:
      - path: Reed
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.reedapp.app
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore ru.reedapp.app"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only: XcodeGen-пресет ставит "1,2" на таргете и перебивает
        # project-base — поэтому дублируем здесь.
        TARGETED_DEVICE_FAMILY: "1"
        # Перебиваем target-level пресет XcodeGen (iPhone Developer) — иначе
        # archive требует Development-сертификат, которого в CI нет.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        INFOPLIST_FILE: Reed/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Reed/Reed.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    # Приложение — чистый SwiftUI без Kotlin/Go: движки (sing-box/olcRTC) живут только в
    # PacketTunnel extension, приложение управляет им через NETunnelProviderManager.

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.reedapp.app.PacketTunnel
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore ru.reedapp.app.PacketTunnel"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ReedCore"
          # go-рантайм gomobile тянет res_9_* из libresolv.
          - "-lresolv"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/Core/ReedCore.xcframework/ios-arm64"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/Core/ReedCore.xcframework/ios-arm64_x86_64-simulator"
    preBuildScripts:
      - name: "Build ReedCore xcframework (sing-box + covert + olcRTC)"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "$SRCROOT/scripts/build-core.sh"
