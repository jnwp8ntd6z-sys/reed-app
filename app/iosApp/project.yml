# XcodeGen-спека iOS-проекта Reed. Генерит iosApp.xcodeproj (app + PacketTunnel extension)
# на CI (macOS), чтобы собирать без ручного Xcode. Заменяет старый ручной pbxproj.
# Настройки перенесены 1:1 из прежнего project.pbxproj + добавлен таргет расширения-туннеля.
name: iosApp
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JA8VKNQGTB
    SUPPORTS_MACCATALYST: false
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: false
    KOTLIN_FRAMEWORK_BUILD_TYPE: release
    # Ручная подпись App Store distribution (сертификат+профили — fastlane match
    # по ASC API-ключу — device-free, без Development-профиля который требует устройств).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.reedapp.app
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore ru.reedapp.app"
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "SharedUI"
          - "-framework"
          - "OlcRtcMobile"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUI/build/generated/olcrtc/ios/OlcRtcMobile.xcframework/ios-arm64"
          - "$(SRCROOT)/../sharedUI/build/bin/iosArm64/$(KOTLIN_FRAMEWORK_BUILD_TYPE)Framework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUI/build/generated/olcrtc/ios/OlcRtcMobile.xcframework/ios-arm64_x86_64-simulator"
          - "$(SRCROOT)/../sharedUI/build/bin/iosSimulatorArm64/$(KOTLIN_FRAMEWORK_BUILD_TYPE)Framework"
    preBuildScripts:
      - name: "Build Shared Frameworks"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$HOME/go/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$ARCHS" ] || [ "$ARCHS" = "undefined_arch" ]; then
            export ARCHS=arm64
          fi
          GRADLE_VERSION_ARGS=""
          if [ -n "$OLCBOX_VERSION" ]; then
            GRADLE_VERSION_ARGS="-Polcbox.version=$OLCBOX_VERSION"
          fi
          cd "$SRCROOT/.."
          ./gradlew $GRADLE_VERSION_ARGS :sharedUI:buildOlcrtcIosXcframework :sharedUI:embedAndSignAppleFrameworkForXcode --no-configuration-cache

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.reedapp.app.PacketTunnel
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore ru.reedapp.app.PacketTunnel"
        INFOPLIST_FILE: PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "OlcRtcMobile"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUI/build/generated/olcrtc/ios/OlcRtcMobile.xcframework/ios-arm64"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../sharedUI/build/generated/olcrtc/ios/OlcRtcMobile.xcframework/ios-arm64_x86_64-simulator"
    preBuildScripts:
      - name: "Build olcRTC xcframework (ext)"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$HOME/go/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$ARCHS" ] || [ "$ARCHS" = "undefined_arch" ]; then export ARCHS=arm64; fi
          cd "$SRCROOT/.."
          ./gradlew :sharedUI:buildOlcrtcIosXcframework --no-configuration-cache
