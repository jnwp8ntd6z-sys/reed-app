# Превью Reed 2.0 для симулятора (CI-задача ios-preview): те же SwiftUI-файлы приложения,
# но вместо системного туннеля — заглушка PreviewTunnel и подставленные данные. Подпись не нужна.
name: Preview
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  Preview:
    type: application
    platform: iOS
    sources:
      - path: ../iosApp/reed2
      - path: ../iosApp/ReedSystemTunnel.swift
      - path: ../iosApp/ReedVPNManager.swift
      - path: ../iosApp/ReedTunnelCache.swift
      - path: ../iosApp/Fonts
        buildPhase: resources
      - path: Preview
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.reedapp.preview
        INFOPLIST_FILE: Preview/Info.plist
        GENERATE_INFOPLIST_FILE: false
